name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # requires-python = "==3.13" in pyproject.toml is a strict PEP 440
      # exact match — only 3.13.0 satisfies it, not later 3.13.x patches.
      - uses: pdm-project/setup-pdm@v4
        with:
          python-version: "3.13.0"
          cache: true

      # The GUI's runtime deps (PySide6 + QtWebEngine) need real shared
      # libraries even headless — this list was worked out empirically
      # against a fresh ubuntu:24.04 container (same base as ubuntu-latest)
      # by installing, running the suite, and closing each missing-library
      # gap it reported.
      - name: Install Qt/WebEngine runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libgl1 libegl1 libopengl0 \
            libxkbcommon0 libxkbcommon-x11-0 \
            libfontconfig1 libfreetype6 libdbus-1-3 \
            libnss3 libnspr4 \
            libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxext6 \
            libasound2t64 libatk1.0-0t64 libatk-bridge2.0-0t64 \
            libcups2t64 libdrm2 libgbm1 \
            libpango-1.0-0 libpangocairo-1.0-0 libcairo2 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libxkbfile1 libwayland-client0 libwayland-egl1 libwayland-cursor0 \
            fonts-liberation libatspi2.0-0t64 libx11-xcb1 libxi6 libxcursor1

      - name: Install dependencies
        run: pdm install -G:all -d

      # Advisory only for now — no pyproject [tool.pylint] config exists
      # yet, so default pylint flags ~360 pre-existing findings (mostly
      # missing-docstring, which conflicts with this project's own "no
      # comments unless non-obvious" convention, and PySide6 no-name-in-
      # module false positives from its compiled bindings). Tune a real
      # config before making this blocking.
      - name: Lint (advisory)
        run: pdm run pylint src/msianalyzer || true

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
          # Chromium's sandbox needs privileges a CI container/runner
          # doesn't grant by default — without this, QtWebEngine-backed
          # tests (mirror plot, MS1 spectrum views) abort the whole
          # process with no traceback. --disable-gpu avoids a similar
          # failure to acquire a GL context headless.
          QTWEBENGINE_CHROMIUM_FLAGS: "--no-sandbox --disable-gpu"
        run: |
          # A rare native abort under offscreen+WebEngine is a known,
          # already-documented flake (ADR 0014, docs/developer/architecture/
          # gui.md) — not a real bug. One retry absorbs it.
          pdm run pytest -q || pdm run pytest -q
