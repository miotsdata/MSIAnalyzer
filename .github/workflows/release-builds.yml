name: Release builds

# Builds the Windows installer and the Linux AppImage and publishes both
# as GitHub *Release* assets, never Actions artifacts: on a private repo
# artifacts count against the Free plan's 500 MB storage (each build
# alone is about that big), while release assets have no total-size
# quota, only < 2 GiB per file.
#
# - Run manually (Actions tab > Release builds > Run workflow, or
#   `gh workflow run release-builds.yml --ref <branch>`): replaces the
#   single `dev-build` pre-release with this build.
# - Push a `v*` tag: creates a normal release for that tag.
#
# No push/PR trigger on purpose: builds cost runner minutes.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-builds-${{ github.ref }}
  cancel-in-progress: true

env:
  # Manual runs publish to one rolling pre-release; tags to their own.
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'dev-build' }}

jobs:
  # The release must exist before both builds upload into it; creating
  # it here once avoids the two build jobs racing to create it.
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            gh release create "$RELEASE_TAG" --generate-notes
          else
            gh release delete "$RELEASE_TAG" --cleanup-tag --yes || true
            gh release create "$RELEASE_TAG" --prerelease \
              --target "$GITHUB_SHA" \
              --title "Dev build (${GITHUB_REF_NAME} @ ${GITHUB_SHA::7})" \
              --notes "Latest manual build from \`${GITHUB_REF_NAME}\`. Replaced on every run."
          fi

  windows:
    needs: release
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: pdm-project/setup-pdm@v4
        with:
          python-version: "3.13"
          # Same pin as ci.yml: the PDM version pdm.lock was made with.
          version: "2.28.0"
          cache: true

      # find-mfs / brain-isotopic-distribution ship no Windows wheel and
      # compile here; the runner image already has the MSVC toolchain.
      - name: Install dependencies
        run: pdm install -G:all -d

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build app + installer
        run: powershell -ExecutionPolicy Bypass -File packaging\windows\build.ps1

      # Catches the classic frozen-app failures (a pruned DLL, a missing
      # hidden import, a QML module left out) without anyone opening it.
      # gui.main only creates freeze_<ts>.txt (FreezeWatchdog) after
      # Main.qml has loaded, so that file existing means startup worked.
      - name: Smoke test (app starts and loads its QML)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $logs = "$env:LOCALAPPDATA\MSIAnalyzer\Logs"
          $p = Start-Process dist\msianalyzer-gui\msianalyzer-gui.exe -PassThru
          $deadline = (Get-Date).AddSeconds(120)
          while (-not (Test-Path "$logs\freeze_*.txt") -and (Get-Date) -lt $deadline -and -not $p.HasExited) {
            Start-Sleep -Seconds 2
          }
          $ok = Test-Path "$logs\freeze_*.txt"
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          Get-Content "$logs\debug_*.log" -Tail 50 -ErrorAction SilentlyContinue
          if (-not $ok) { throw "App did not finish starting within 120 s (exited: $($p.HasExited))" }

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/MSIAnalyzer-setup-*.exe --clobber

  linux:
    needs: release
    # Not ubuntu-latest: an AppImage only runs on systems with at least
    # the glibc it was built against, so build on the oldest supported
    # base (22.04 → glibc 2.35, also covers RHEL/Rocky 9).
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: pdm-project/setup-pdm@v4
        with:
          python-version: "3.13"
          version: "2.28.0"
          cache: true

      # ci.yml's list, with 22.04's package names (no `t64` suffixes,
      # that rename came with 24.04). Needed to run the frozen app in the
      # smoke test; build-essential is for find-mfs's C extension.
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libgl1 libegl1 libopengl0 \
            libxkbcommon0 libxkbcommon-x11-0 \
            libfontconfig1 libfreetype6 libdbus-1-3 \
            libnss3 libnspr4 \
            libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxext6 \
            libasound2 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libdrm2 libgbm1 \
            libpango-1.0-0 libpangocairo-1.0-0 libcairo2 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libxkbfile1 libwayland-client0 libwayland-egl1 libwayland-cursor0 \
            fonts-liberation libatspi2.0-0 libx11-xcb1 libxi6 libxcursor1

      - name: Install dependencies
        run: pdm install -G:all -d

      - name: Build app + AppImage
        run: packaging/appimage/build.sh

      # Same check as the Windows job: freeze_<ts>.txt appears only once
      # Main.qml has loaded.
      - name: Smoke test (app starts and loads its QML)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          logs="$HOME/.local/state/MSIAnalyzer/log"
          dist/msianalyzer-gui/msianalyzer-gui & pid=$!
          for _ in $(seq 60); do
            ls "$logs"/freeze_*.txt >/dev/null 2>&1 && break
            kill -0 "$pid" 2>/dev/null || break
            sleep 2
          done
          ok=0; ls "$logs"/freeze_*.txt >/dev/null 2>&1 && ok=1
          kill "$pid" 2>/dev/null || true
          tail -n 50 "$logs"/debug_*.log 2>/dev/null || true
          [[ $ok == 1 ]] || { echo "App did not finish starting within 120 s"; exit 1; }

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/MSIAnalyzer-x86_64.AppImage --clobber
