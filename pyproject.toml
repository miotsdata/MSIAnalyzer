[project]
name = "MSIAnalyzer"
version = "0.1.0"
description = "App to analyze MSI data"
authors = [
    {name = "Matteo Miotto", email = "miotsdata@gmail.com"},
]
dependencies = ["libviz>=0.1.3", "plotly>=6.8.0,<7", "anndata>=0.13.2", "tomli-w>=1.2.0", "matplotlib>=3.11.1", "kaleido>=1.3.0"]
requires-python = ">=3.13,<3.14"
readme = "README.md"
license = {text = "MIT"}

[project.optional-dependencies]
gui = ["pyside6>=6.11.1"]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project.scripts]
msianalyzer = "msianalyzer.cli.main:main"
msianalyzer-gui = "msianalyzer.gui.main:main"

[tool.pdm]
distribution = true

[tool.pdm.build]
# `configure_logging`'s default debug_log_dir is `src/msianalyzer/log`
# (next to the package, for dev convenience — see
# core/utils/logging_utils.py) — never gitignored/tracked, but every
# debug run leaves a file there, and pdm-backend packages everything
# under the package directory by default. Without this exclude, a
# build silently ships whatever debug logs happen to be on the
# machine building it (374 of them, one 15MB, found in a real build).
# tests/core/examples' real instrument data (.raw/.mzML + generated
# .db/.h5ad results, hundreds of MB) bloats the sdist the same way —
# never shipped in the wheel (pdm-backend excludes tests/ from it by
# default), only relevant to `pdm build`'s sdist output.
excludes = ["src/msianalyzer/log/**", "tests/core/examples/**"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "find-mfs>=0.4.0",
    "jupyter>=1.1.1",
    "pylint>=4.0.6",
    "pytest-mock>=3.15.1",
    "pytest-qt>=4.5.0",
    "hypothesis>=6.167.1",
    "mkdocstrings[python]>=1.0.6",
    "mkdocs-material>=9.7.7",
    "pyinstaller>=6.22.3",
]
