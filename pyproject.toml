[project]
name = "MSIAnalyzer"
version = "0.1.0"
description = "App to analyze MSI data"
authors = [
    {name = "Matteo Miotto", email = "miotsdata@gmail.com"},
]
dependencies = ["libviz>=0.1.2", "pyside6>=6.11.1", "plotly>=6.8.0", "anndata>=0.13.2", "tomli-w>=1.2.0", "matplotlib>=3.11.1", "kaleido>=1.3.0"]
requires-python = "==3.13"
readme = "README.md"
license = {text = "MIT"}

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project.scripts]
msianalyzer = "msianalyzer.cli.main:main"

[tool.pdm]
distribution = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "find-mfs>=0.4.0",
    "jupyter>=1.1.1",
    "pylint>=4.0.6",
    "pytest-mock>=3.15.1",
]
