[project]
name = "MSIAnalyzer"
version = "0.7.1"
description = "App to analyze MSI data"
authors = [
    {name = "Matteo Miotto", email = "miotsdata@gmail.com"},
]
dependencies = ["libviz>=0.1.4", "plotly>=6.8.0,<7", "anndata>=0.13.2", "tomli-w>=1.2.0", "matplotlib>=3.11.1", "kaleido>=1.3.0", "pyteomics>=4.7.5", "msbuddy>=0.3.16", "lightgbm>=4.7.0", "pillow>=12.3.0", "squidpy>=1.8.3", "platformdirs>=4.3.6"]
requires-python = ">=3.13,<3.14"
readme = "README.md"
license = {text = "MIT"}

[project.optional-dependencies]
# Not the `pyside6` meta-package: since 6.12 it also pulls PySide6-WebEngine
# (~280 MB) and PySide6-Pdf, which the GUI doesn't use (ADR 51). Qt Graphs
# is in Addons.
gui = ["pyside6-essentials>=6.12.0", "pyside6-addons>=6.12.0"]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project.scripts]
msianalyzer = "msianalyzer.cli.main:main"
msianalyzer-gui = "msianalyzer.gui.main:main"

[tool.pdm]
distribution = true

[tool.pdm.build]
# `configure_logging`'s default debug_log_dir used to be
# `src/msianalyzer/log` (now the OS per-user log dir, via platformdirs);
# old checkouts still have one full of debug logs, and pdm-backend
# packages everything under the package directory by default. Without
# this exclude, a build silently ships them (374, one 15MB, found in a
# real build).
# tests/core/examples' real instrument data (.raw/.mzML + generated
# .db/.h5ad results, hundreds of MB) bloats the sdist the same way —
# never shipped in the wheel (pdm-backend excludes tests/ from it by
# default), only relevant to `pdm build`'s sdist output.
excludes = ["src/msianalyzer/log/**", "tests/core/examples/**"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "find-mfs>=0.4.0",
    "jupyter>=1.1.1",
    "pylint>=4.0.6",
    "pytest-mock>=3.15.1",
    "pytest-qt>=4.5.0",
    "hypothesis>=6.167.1",
    "mkdocstrings[python]>=1.0.6",
    "mkdocs-material>=9.7.7",
    "pyinstaller>=6.22.3",
    "archunitpython>=1.8.1",
]
