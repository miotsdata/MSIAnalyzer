site_name: MSIAnalyzer
site_description: Mass-spectrometry imaging pipeline — parsing, averaging, alignment, MS2 annotation.

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - content.code.copy
    - toc.follow
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            members_order: source

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - User guide:
      - user-guide/index.md
      - Concepts: user-guide/concepts.md
      - The workflow: user-guide/workflow.md
      - Projects & configuration: user-guide/projects-and-config.md
      - Outputs: user-guide/outputs.md
      - MS2 annotation: user-guide/ms2-annotation.md
  - Developer:
      - developer/developer.md
      - Architecture:
          - developer/architecture/index.md
          - Core modules: developer/architecture/core-modules.md
